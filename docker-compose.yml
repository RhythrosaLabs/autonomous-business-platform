# =============================================================================
# Docker Compose - Autonomous Business Platform Pro
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abp-app
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./campaigns:/app/campaigns
      - ./sessions:/app/sessions
      - ./workflows:/app/workflows
      - ./task_artifacts:/app/task_artifacts
      - ./runs:/app/runs
      - ./temp_files:/app/temp_files
      - ./brand_templates.json:/app/brand_templates.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
